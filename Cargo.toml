[package]
name = "sandb0x-xtract0r"
version = "0.9.0"
edition = "2021"
description = "Sandbox extraction, analysis, and orchestration engine"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/darnellwashingtonjr94-art/Sandb0x-Xtract0r"

[features]
default = []
core = []
api = ["core"]
orchestrator = ["core"]
reporting = ["core"]
sandboxes = ["core"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.37", features = ["full"], optional = true }
clap = { version = "4.5", features = ["derive"] }
