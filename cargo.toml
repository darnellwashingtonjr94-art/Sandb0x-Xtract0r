[package]
name = "sandb0x-xtract0r"
version = "0.1.0"
edition = "2021"
description = "Sandbox extraction, analysis, and orchestration engine"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-username/Sandb0x-Xtract0r"
keywords = ["sandbox", "extraction", "security", "orchestrator"]
categories = ["command-line-utilities", "security"]

[features]
default = []
core = []
api = ["core"]
extractors = ["core"]
orchestrator = ["core"]
reporting = ["core"]
sandboxes = ["core"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.37", features = ["full"], optional = true }
clap = { version = "4.5", features = ["derive"] }
