name: Docker Build & Push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Format image tags & force lowercasing
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sandbox-api
            ${{ secrets.DOCKERHUB_USERNAME }}/sandbox-api
          tags: |
            type=raw,value=latest
            type=sha

      # 4. Lowercase repository string fix
      - name: Lowercase image names
        id: lowercase
        run: |
          echo "tags=$(echo "${{ steps.meta.outputs.tags }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 5. Build and push image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.lowercase.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
